name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.0

      - name: No classical signature checks in contracts
        run: |
          if grep -rn "ecrecover" contracts/src; then
            echo "ecrecover found: contracts must authorize with ML-DSA-87 via pqcVerify"
            exit 1
          fi

      - name: Build
        working-directory: contracts
        run: forge build

      - name: Test
        working-directory: contracts
        run: forge test -vv

  qorescan:
    name: QoreScan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The launcher downloads the qorescan release binary and runs it only if its SHA-256
      # matches the digests shipped in this exact package version.
      - name: Inventory the contracts' cryptography (CycloneDX CBOM)
        run: npx --yes @qorechain/qorescan@0.1.0 solidity contracts/src --out cbom.json

      - name: No quantum-vulnerable cryptography in contracts
        run: node scripts/check-cbom.mjs cbom.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cbom
          path: cbom.json

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test
