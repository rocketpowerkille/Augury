[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
# Conservative target: no PUSH0, safe for any EVM fork the chain runs.
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = true

[fmt]
line_length = 100

[lint]
# Immutables are public getters read by the TypeScript packages, so they keep camelCase.
exclude_lints = ["screaming-snake-case-immutable"]
